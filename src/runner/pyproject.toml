[project]
name = "featherlane-runner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["featherlane-contracts", "httpx2==2.13.0"]

[tool.uv.sources]
featherlane-contracts = { workspace = true }

[project.scripts]
flf-runner = "featherlane_runner.cli:main"

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/featherlane_runner"]
