[project]
name = "featherlane-control-plane"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "featherlane-contracts",
    "fastapi==0.162.0",
    "sqlalchemy[asyncio]==2.0.55",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
    "authlib==1.9.1",
    "httpx2==2.13.0",
    "dbos==3.4.0",
]

[tool.uv.sources]
featherlane-contracts = { workspace = true }

[project.scripts]
flf-api = "featherlane_api.cli:main"
flf-worker = "featherlane_api.workflows.worker:main"

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/featherlane_api"]
