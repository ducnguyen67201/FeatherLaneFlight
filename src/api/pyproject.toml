[project]
name = "featherlane-control-plane"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["featherlane-contracts", "fastapi==0.162.0"]

[tool.uv.sources]
featherlane-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/featherlane_api"]
