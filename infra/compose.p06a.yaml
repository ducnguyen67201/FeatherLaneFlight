name: featherlane-p06a
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: flf
      POSTGRES_DB: featherlane_p06a
      POSTGRES_PASSWORD: ${FLF_P06A_DB_PASSWORD:?Supply a private process-injected password}
    ports:
      - "127.0.0.1:55408:5432"
    volumes:
      - ../.local/p06a/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flf -d featherlane_p06a"]
      interval: 2s
      timeout: 3s
      retries: 15
